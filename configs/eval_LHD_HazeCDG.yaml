# =============================================================================
# Learning Hazing to Dehazing (CVPR 2025)
# + Haze Counter-Degradation Guidance (HazeCDG)
# =============================================================================
#
# Final HazeCDG formulation
# -------------------------
# At a sensing anchor a, the frozen haze-generation model G_D is evaluated at
# the current restoration state with its learned IRControlNet branch both off
# and on:
#
#   g_a      = eps_D,a - eps_base,a
#   eps_CD,a = eps_base,a - g_a
#
# HazeCDG replaces the degradation reference eps_D,a = eps_base,a + g_a by the
# counter-degradation reference eps_CD,a while preserving the relative
# restoration-degradation prediction offset. This gives
#
#   eps_R^HazeCDG = eps_R - 2 g_a
#
# The factor 2 is implied by the counter-degradation construction and is not a
# tuned guidance-strength hyperparameter.
#
# Sparse degradation sensing
# --------------------------
# For the standard 50-step DiffDehaze evaluation, the paper experiments use
# fixed, deterministic, nested sensing schedules:
#
#   A5 subset A10 subset A25 subset A50
#
# At non-anchor steps, G_D and eps_base are not reevaluated. The most recently
# sensed haze differential is reused causally, corresponding to
#
#   eps_R^HazeCDG(x_t,t) = eps_R(x_t,t) - 2 g_a(t)
#
# where a(t) is the most recent sensing anchor. K=50 is dense HazeCDG; K=5 is
# the default sparse configuration used in the paper.
#
# Public dataset layout
# ---------------------
# Only the three real-world benchmarks evaluated in the paper are supported:
#
#   dataset/RTTS/
#   dataset/URHI/
#   dataset/Fattal/
#
# The selected folder is evaluated recursively. To reproduce the paper, place
# the 4,322 RTTS images, fixed 150-image URHI subset, and 31 Fattal images in
# the corresponding folders.
#
# Output
# ------
# baseline:
#   outputs/LHD/baseline/<DATASET>/
# HazeCDG:
#   outputs/LHD/hazecdg/<DATASET>/K005/
#   outputs/LHD/hazecdg/<DATASET>/K010/
#   outputs/LHD/hazecdg/<DATASET>/K025/
#   outputs/LHD/hazecdg/<DATASET>/K050/
#
# Controlled preprocessing
# ------------------------
# If either input dimension is below 512, Resize(512) is applied first. H and W
# are then resized independently to the nearest multiple of 64 using bicubic
# interpolation, with no zero padding. Saved outputs are restored to the
# original image resolution.
# =============================================================================

experiment:
  # baseline | hazecdg
  mode: hazecdg

paths:
  repo_root: ./third_party/Learning-Hazing-to-Dehazing
  stage1_config: ./third_party/Learning-Hazing-to-Dehazing/configs/inference/stage1.yaml
  stage2_config: ./third_party/Learning-Hazing-to-Dehazing/configs/inference/stage2.yaml
  sd_checkpoint: ./checkpoints/Learning-Hazing-to-Dehazing/v2-1_512-ema-pruned.ckpt
  stage1_checkpoint: ./checkpoints/Learning-Hazing-to-Dehazing/stage1.pt
  stage2_checkpoint: ./checkpoints/Learning-Hazing-to-Dehazing/stage2.pt

data:
  # RTTS | URHI | Fattal
  dataset: RTTS

  # Automatic input path:
  #   RTTS   -> ./dataset/RTTS/
  #   URHI   -> ./dataset/URHI/
  #   Fattal -> ./dataset/Fattal/
  dataset_root: ./dataset

  # Optional explicit override. Leave empty for the automatic paths above.
  input_root: ""

  # Empty -> automatic:
  # baseline -> outputs/LHD/baseline/<DATASET>/
  # hazecdg  -> outputs/LHD/hazecdg/<DATASET>/Kxxx/
  output_root: ""

  # 0 = evaluate every image in the selected dataset folder.
  # 1 = smoke test; larger positive values evaluate the first N sorted images.
  max_images: 0

  # Resume already-completed outputs.
  skip_existing: true

inference:
  # Standard LHD SpacedSampler. AccSamp / RGB fidelity guidance are OFF.
  steps: 50
  dehaze_prompt: "remove dense fog"
  progress: true

hazecdg:
  # Haze text condition used by the frozen degradation model G_D.
  degradation_prompt: "hazy, foggy, misty, obscure, smoggy."

  # Default paper setting: K=5 sparse sensing anchors.
  # For the complete sensing-budget sweep, use: [5, 10, 25, 50]
  anchor_counts: [5]

  # Step logging only; does not affect the algorithm.
  log_every: 100

runtime:
  expected_conda_env: LHD_xformers_blackwell
  device: cuda:0
  attention_mode: xformers
  seed: 231
  cuda_visible_devices: ""
  save_original_size: true

  # Keep false for controlled final-paper runs.
  oom_retry_enabled: false
  oom_retry_scales: [0.75, 0.50, 0.375, 0.25]
