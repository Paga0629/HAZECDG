# =============================================================================
# Diffusion Once and Done (DOD, AAAI 2026) + HazeCDG
# =============================================================================
# DOD is an official one-step SD2.1 restoration model.
#
# baseline
# --------
#   Official DOD inference:
#       hazy image
#       -> MFM degradation context
#       -> DOD Stage1 VAE encoder
#       -> DOD conditional-LoRA SD2.1 UNet: eps_R at t=999
#       -> official one-step DDPMScheduler.step
#       -> official Stage2 HDE decoder
#
# hazecdg
# -------
#   The DOD path is unchanged except for one correction immediately before
#   scheduler.step:
#
#       g      = eps_D - eps_base
#       q      = 2 g
#       eps_R' = eps_R - 2 g
#
#   eps_D and eps_base are evaluated by the frozen LHD Stage1 HazeGen field at
#   DOD's exact lq_latent and native timestep t=999. The factor 2 is the exact
#   symmetric transport from +g to -g about eps_base.
#
# Important
# ---------
# - steps MUST remain 1 for the released DOD checkpoint.
# - DOD has one restoration UNet call, so sparse anchor scheduling is not used.
# - No guidance-strength hyperparameter is introduced.
# - DOD, HazeGen, and all decoder weights remain frozen.
#
# Automatic outputs
# -----------------
# baseline -> outputs/DOD/baseline/<DATASET>/
# hazecdg  -> outputs/DOD/hazecdg/<DATASET>/
# =============================================================================

experiment:
  # baseline | hazecdg
  mode: hazecdg

paths:
  # ---------------------------------------------------------------------------
  # Official DOD
  # ---------------------------------------------------------------------------
  dod_repo_root: ./third_party/DOD
  dod_sd21_root: ./checkpoints/DOD/sd21
  dod_stage1_checkpoint: ./checkpoints/DOD/stage1.pkl
  dod_stage2_checkpoint: ./checkpoints/DOD/stage2.pkl
  dod_mfm_checkpoint: ./checkpoints/DOD/mfm/256x256_diffusion_uncond.pt
  dod_prompt_embeds: ./third_party/DOD/prompt_embeds.pt

  # ---------------------------------------------------------------------------
  # LHD Stage1 HazeGen -- loaded ONLY when experiment.mode=hazecdg
  # ---------------------------------------------------------------------------
  lhd_repo_root: ./third_party/Learning-Hazing-to-Dehazing
  lhd_stage1_config: ./third_party/Learning-Hazing-to-Dehazing/configs/inference/stage1.yaml
  lhd_sd_checkpoint: ./checkpoints/Learning-Hazing-to-Dehazing/v2-1_512-ema-pruned.ckpt
  lhd_stage1_checkpoint: ./checkpoints/Learning-Hazing-to-Dehazing/stage1.pt

data:
  # RTTS | URHI | Fattal
  dataset: Fattal
  dataset_root: ./datasets

  # Empty -> use the same automatic dataset paths as eval_LHD_HazeCDG.py:
  # RTTS         : datasets/RTTS
  # URHI         : datasets/URHI
  # Fattal       : datasets/Fattal
  input_root: "./datasets/Fattal"

  # Empty -> automatic:
  # baseline -> outputs/DOD/baseline/<DATASET>/
  # hazecdg     -> outputs/DOD/hazecdg/<DATASET>/
  output_root: ""

  # 0 = full dataset; 1 = smoke test; 10/25/50 = quick diagnostic.
  max_images: 0

  # Resume already-completed outputs.
  skip_existing: true

inference:
  # CRITICAL: released DOD is trained and evaluated as one-step diffusion.
  steps: 1

  # Official test.py default preprocessing.
  process_size: 256
  upscale: 1

  # Official inference default.
  mixed_precision: fp16
  lora_rank: 8

  # Official DOD latent tiling defaults.
  latent_tiled_size: 96
  latent_tiled_overlap: 32
  vae_decoder_tiled_size: 224
  vae_encoder_tiled_size: 1024

hazecdg:
  # Stage1 HazeGen text condition used to construct g = eps_D - eps_base.
  degradation_prompt: "hazy, foggy, misty, obscure, smoggy."

  # Diagnostic printing only; does not change the algorithm.
  log_diagnostics: true

runtime:
  expected_conda_env: hazecdg

  # Upstream DOD uses explicit .cuda() calls. Keep cuda:0; use
  # CUDA_VISIBLE_DEVICES below if a different physical GPU is desired.
  device: cuda:0
  cuda_visible_devices: ""

  # Applies only to the LHD Stage1 sensing branch in hazecdg mode.
  lhd_attention_mode: xformers

  # Fixed per-image seed is important because DOD uses latent_dist.sample().
  # Using the same seed in baseline and hazecdg keeps the DOD latent controlled.
  seed: 231

  # Restore outputs to original HxW for dataset metric compatibility.
  save_original_size: true

